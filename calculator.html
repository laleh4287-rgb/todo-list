<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ماشین‌حساب</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <h1>ماشین‌حساب ساده</h1>

    <input type="number" id="num1" placeholder="عدد اول">
    <input type="number" id="num2" placeholder="عدد دوم">

    <br><br>

    <button id="addBtn">جمع (+)</button>
    <button id="subBtn">تفریق (-)</button>
    <button id="mulBtn">ضرب (×)</button>
    <button id="divBtn">تقسیم (÷)</button>
    <button id="clearBtn">پاک کردن</button>

    <h2>نتیجه: <span id="result">۰</span></h2>

    <script src="calculator.js"></script>
</body>
</html>
